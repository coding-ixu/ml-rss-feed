name: Promote routine digest to main

# The Claude Code routine pushes the daily digest to an auto-named `claude/*`
# branch (it cannot push to main). This server-side action copies that output
# onto main so GitHub Pages (main/docs) stays current. See .github/scripts/promote.py.

on:
  schedule:
    - cron: '45 23 * * *'   # ~08:45 JST, shortly after the 08:00 JST routine run
    - cron: '0 1 * * *'     # ~10:00 JST backstop in case the routine ran late
  workflow_dispatch: {}
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write
  pages: write

concurrency:
  group: promote-main
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch claude/* branches
        run: git fetch origin '+refs/heads/claude/*:refs/remotes/origin/claude/*' --prune

      - name: Promote newest routine branch into main
        run: python3 .github/scripts/promote.py "${{ github.event_name }}" "${{ github.ref }}"

      # main/docs is served by the legacy Pages pipeline, which can wedge
      # ("Deployment failed, try again later.") and freeze the public site even
      # though main is current. Force a fresh build and wait for it, so a wedged
      # deploy self-heals on the next promote/schedule run instead of silently
      # stopping delivery.
      - name: Ensure GitHub Pages published (self-heal wedged deploys)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Pages build attempt $attempt: requesting a fresh build..."
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null
            for _ in $(seq 1 24); do
              sleep 10
              status=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '.status')
              echo "  status=$status"
              case "$status" in
                built)   echo "Pages build succeeded."; exit 0 ;;
                errored) echo "Pages build errored; retrying..."; break ;;
              esac
            done
          done
          echo "::error::GitHub Pages build did not reach 'built' after retries."
          exit 1
